<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV Energy Consumption Histogram</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisation.css">
</head>

<body>

    <header>
        <h1>TV Energy Consumption</h1>
        <p>Distribution of energy consumption for TVs in the January 2026 dataset.</p>
    </header>
    
    <main>
    <div class="histogram-layout">
        <div id="filters_screen"></div>
        <div id="histogram"></div>
    </div>
    </main>
    <section class="scatterplot-section">
    <h2>TV Energy Consumption vs Star Rating</h2>
    <p>Relationship between energy consumption, star rating and screen technology.</p>

    <div id="scatterplot" class="responsive-svg-container"></div>
    </section>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script src="js/load-data.js"></script>
    <script src="js/shared-constants.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatterplot.js"></script>

</body>

</html>
